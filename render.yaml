# Render blueprint — FitCoach Pro 2.0 backend (FastAPI) + managed Postgres.
#
# One-time: Render dashboard -> New + -> Blueprint -> pick this repo/branch.
# Render creates the web service + database and wires DATABASE_URL automatically.
# After the frontend is live on Vercel, set FRONTEND_ORIGIN to that HTTPS URL and redeploy.
# See DEPLOYMENT.md for the full runbook (migrations, seed, Vercel side, cookie/WebSocket topology).

services:
  - type: web
    name: fitcoach-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Runs before each deploy on paid instances. On the free plan, run
    # `alembic upgrade head` once from the Render Shell instead (see DEPLOYMENT.md).
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECURE_COOKIES
        value: "true"
      - key: SECRET_KEY
        generateValue: true # Render generates a strong random value (verify >= 32 chars)
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        fromDatabase:
          name: fitcoach-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false # set to your Vercel URL, e.g. https://fitcoach-pro.vercel.app, then redeploy

databases:
  - name: fitcoach-db
    plan: free
    databaseName: fitcoach
    user: fitcoach
